### model
model_name_or_path: pretrained/models/Qwen--Qwen3-VL-2B-Instruct/snapshots/master
image_max_pixels: 1000000
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all

### dataset
dataset_dir: /root/autodl-tmp/.autodl/data
dataset: train_parking
template: qwen3_vl_nothink
cutoff_len: 20480
preprocessing_num_workers: 1
dataloader_num_workers: 4

### output
output_dir: saves/qwen3-vl-2b-parking-grounding-16r8b1g1-4lr5e-enable-vit
logging_steps: 100
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

###vlm解冻vit参数
freeze_vision_tower: false
freeze_multi_modal_projector: true

